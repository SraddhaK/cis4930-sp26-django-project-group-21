{% extends "myapp/base.html" %}

{% block title %}Fetch Weather Data{% endblock %}

{% block content %}
<div class="card mb-4">
  <div class="card-body">
    <div class="card-header">
      <h1 class="mb-0">Fetch Live Weather Data</h1>
    </div>
    <div class="card-body">
      <p class="card-text">
        Pulls yesterday's hourly temperature data for Tallahassee, Miami, and Orlando.
      </p>
      <form method="post" action="/fetch/run/">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary">Run fetch</button>
      </form>
      {% if message %}
        <div class="alert {% if success %}alert-success{% else %}alert-danger{% endif %} mt-3">
          {{ message }}
        </div>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
