{% extends "myapp/base.html" %}

{% block title %}
    {% if pokemon %} Edit Pokemon {% else %} Add Pokemon {% endif %}
{% endblock %}

{% block content %}
<h1>
    {% if pokemon %} Edit {{ pokemon.name }} {% else %} Add New Pokemon {% endif %}
</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>

<p><a href="{% url 'myapp:record_list' %}">Cancel</a></p>
{% endblock %}
